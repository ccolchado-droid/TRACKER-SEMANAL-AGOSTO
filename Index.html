<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker de Campañas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 32px 48px;
    background: #f0f0f0;
    font-family: 'Nunito', sans-serif;
    color: #2c2c2c;
  }
  .page-header {
    margin-bottom: 28px;
  }
  .page-header h1 {
    font-size: 26px;
    font-weight: 900;
    margin: 0 0 4px;
    color: #333;
  }
  .page-header p {
    margin: 0;
    color: #777;
    font-size: 14px;
  }

  .campaign-section {
    border-radius: 18px;
    padding: 20px 22px 24px;
    margin-bottom: 26px;
  }

  .campaign-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }

  .campaign-header h2 {
    margin: 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.3px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.5);
    padding: 4px;
    border-radius: 14px;
  }

  .tab-btn {
    border: none;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    padding: 8px 16px;
    border-radius: 10px;
    background: transparent;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .view { display: none; }
  .view.active { display: block; }

  .cards-row {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: stretch;
  }

  .donut-card {
    border-radius: 18px;
    padding: 14px 14px 16px;
    width: 168px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #ffffff;
  }

  .donut-card-title {
    font-size: 13px;
    font-weight: 800;
    text-align: center;
    line-height: 1.25;
    min-height: 32px;
    display: flex;
    align-items: center;
  }

  .donut-card-total {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.85;
    margin-bottom: 10px;
  }

  .donut-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    margin-bottom: 10px;
  }

  .donut-pct {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 17px;
    font-weight: 900;
    color: #ffffff;
    pointer-events: none;
  }

  .legend {
    display: flex;
    gap: 12px;
    font-size: 10.5px;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.pending { background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); }
  .dot.completed { background: rgba(255,255,255,0.92); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
  }

  .chip {
    background: rgba(255,255,255,0.22);
    color: #ffffff;
    font-size: 9.5px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 20px;
    line-height: 1.2;
    text-align: center;
  }

  .dates-card {
    border-radius: 18px;
    width: 145px;
    flex: 0 0 145px;
    padding: 14px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }

  .dates-card-title {
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    opacity: 0.75;
    margin-bottom: 2px;
  }

  .dates-item span {
    display: block;
    font-size: 10px;
    font-weight: 700;
    opacity: 0.7;
    margin-bottom: 2px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .dates-item strong {
    display: block;
    font-size: 14px;
    font-weight: 900;
  }

  .no-data {
    font-size: 13px;
    font-weight: 600;
    color: #888;
    padding: 20px;
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>Dashboard de Campañas</h1>
  <p>Programación y efectividad de visitas por punto de venta</p>
</div>

<div id="app"></div>

<script>
const CAMPAIGNS = [{"name": "PALL MALL NEWBC", "color": {"main": "#5b7fa6", "card": "#e4eaf3", "dates": "#ccd5e3"}, "categories": [{"name": "Primary POP", "total": 1152, "visit": 662, "done": 427, "materials": ["GLORIFICADOR PALL MALL", "PLACA DE CIGARRERA"]}, {"name": "Secondary POP", "total": 1844, "visit": 1067, "done": 1025, "materials": ["GLORIFICADOR PALL MALL", "JALAVISTA CAVA - AGOSTO", "JALAVISTA CAVA - GRATI", "JALAVISTA MONITOR", "PLACA DE CIGARRERA", "STICKER MESON - AGOSTO", "STICKER MESON - GRATI", "TABLE TENT - AGOSTO", "TABLE TENT - GRATI", "VIBRIN - COMBOPACK"]}, {"name": "Special Implementations", "total": 44, "visit": 44, "done": 44, "materials": ["COLGANTE", "STICKER EEFF"]}, {"name": "B2B Material", "total": 1334, "visit": 1318, "done": 1317, "materials": ["CARTILLA B2B"]}], "kickoff": "01/07/2026", "end": "26/08/2026"}, {"name": "CROSS JULIO", "color": {"main": "#5b7fa6", "card": "#e4eaf3", "dates": "#ccd5e3"}, "categories": [{"name": "Secondary POP", "total": 400, "visit": 399, "done": 376, "materials": ["TABLE TENT", "VIBRIN", "VIBRIN SIN PROMO"]}], "kickoff": "01/07/2026", "end": "25/07/2026"}, {"name": "VUSE AROMATIC TOBACCO", "color": {"main": "#7c4fcc", "card": "#ede4fc", "dates": "#d9c8f7"}, "categories": [{"name": "Secondary POP", "total": 1536, "visit": 515, "done": 478, "materials": ["CENEFA - AGOSTO", "FLAPS VUSE AROMATIC", "FLAPS VUSE SIN AROMATIC", "HEADER VUSE", "JALAVISTA MONITOR CON AROMATIC TOBACCO", "JALAVISTA MONITOR SIN AROMATIC TOBACCO", "REEL", "VIBRIN CON AROMATIC TOBACCO", "VIBRIN SIN AROMATIC TOBACCO"]}], "kickoff": "01/07/2026", "end": "25/08/2026"}, {"name": "EXPANSIÓN VELO TAMBO", "color": {"main": "#3ab4e0", "card": "#daf0fb", "dates": "#b8e3f5"}, "categories": [{"name": "Primary POP", "total": 136, "visit": 136, "done": 124, "materials": ["PLACA VELO"]}], "kickoff": "20/07/2026", "end": "09/08/2026"}];

function pctOrZero(num, den) {
  if (!den) return 0;
  return Math.round((num / den) * 100);
}

function slugify(str) {
  return str.toLowerCase().replace(/[^a-z0-9]+/g, '_');
}

function buildDonutCard(campaignSlug, viewKey, cat, color) {
  const isProg = viewKey === 'prog';
  const referenceTotal = isProg ? cat.total : cat.visit;
  const pct = isProg ? pctOrZero(cat.visit, cat.total) : pctOrZero(cat.done, cat.visit);
  const canvasId = `donut_${campaignSlug}_${viewKey}_${slugify(cat.name)}`;

  const chipsHtml = cat.materials.map(m => `<span class="chip">${m}</span>`).join('');

  return `
    <div class="donut-card" style="background:${color.main};">
      <div class="donut-card-title">${cat.name}</div>
      <div class="donut-card-total">${referenceTotal.toLocaleString('es-PE')} POS</div>
      <div class="donut-wrap">
        <canvas id="${canvasId}" width="100" height="100"></canvas>
        <div class="donut-pct">${pct}%</div>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="dot pending"></span>Pending</span>
        <span class="legend-item"><span class="dot completed"></span>Completed</span>
      </div>
      <div class="chips">${chipsHtml}</div>
    </div>
  `;
}

function buildDatesCard(campaign) {
  return `
    <div class="dates-card" style="background:${campaign.color.dates}; color:${campaign.color.main};">
      <div class="dates-card-title">Campaign Dates</div>
      <div class="dates-item">
        <span>Kick off</span>
        <strong>${campaign.kickoff || '—'}</strong>
      </div>
      <div class="dates-item">
        <span>Projected end date</span>
        <strong>${campaign.end || '—'}</strong>
      </div>
    </div>
  `;
}

function buildView(campaign, campaignSlug, viewKey) {
  const cardsHtml = campaign.categories
    .map(cat => buildDonutCard(campaignSlug, viewKey, cat, campaign.color))
    .join('');
  const datesHtml = buildDatesCard(campaign);
  return `<div class="cards-row">${cardsHtml}${datesHtml}</div>`;
}

function renderCampaign(campaign) {
  const slug = slugify(campaign.name);
  const section = document.createElement('div');
  section.className = 'campaign-section';
  section.style.background = campaign.color.card;

  section.innerHTML = `
    <div class="campaign-header">
      <h2 style="color:${campaign.color.main};">${campaign.name}</h2>
      <div class="tabs" data-campaign="${slug}">
        <button class="tab-btn active" data-view="prog" style="background:${campaign.color.main}; color:#ffffff;">Programación de visitas</button>
        <button class="tab-btn" data-view="eff" style="color:${campaign.color.main};">Efectividad de visitas</button>
      </div>
    </div>
    <div class="view prog-view active" data-view="prog">
      ${buildView(campaign, slug, 'prog')}
    </div>
    <div class="view eff-view" data-view="eff">
      ${buildView(campaign, slug, 'eff')}
    </div>
  `;

  return section;
}

function initCharts(campaign) {
  const slug = slugify(campaign.name);
  ['prog', 'eff'].forEach(viewKey => {
    const isProg = viewKey === 'prog';
    campaign.categories.forEach(cat => {
      const pct = isProg ? pctOrZero(cat.visit, cat.total) : pctOrZero(cat.done, cat.visit);
      const canvasId = `donut_${slug}_${viewKey}_${slugify(cat.name)}`;
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      new Chart(canvas, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [100 - pct, pct],
            backgroundColor: ['rgba(255,255,255,0.25)', 'rgba(255,255,255,0.92)'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: false,
          cutout: '72%',
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          }
        }
      });
    });
  });
}

function attachTabHandlers(section) {
  const tabButtons = section.querySelectorAll('.tab-btn');
  const views = section.querySelectorAll('.view');
  const mainColor = section.querySelector('h2').style.color;

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const targetView = btn.getAttribute('data-view');

      tabButtons.forEach(b => {
        if (b === btn) {
          b.classList.add('active');
          b.style.background = mainColor;
          b.style.color = '#ffffff';
        } else {
          b.classList.remove('active');
          b.style.background = 'transparent';
          b.style.color = mainColor;
        }
      });

      views.forEach(v => {
        if (v.getAttribute('data-view') === targetView) {
          v.classList.add('active');
        } else {
          v.classList.remove('active');
        }
      });
    });
  });
}

const app = document.getElementById('app');

if (!CAMPAIGNS.length) {
  app.innerHTML = '<div class="no-data">No se encontraron campañas para mostrar.</div>';
} else {
  CAMPAIGNS.forEach(campaign => {
    const section = renderCampaign(campaign);
    app.appendChild(section);
    attachTabHandlers(section);
    initCharts(campaign);
  });
}
</script>

</body>
</html>
